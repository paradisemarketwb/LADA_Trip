plugins { id 'com.android.application' }

android {
    namespace 'ru.ladatrip.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.ladatrip.app'
        minSdk 28
        targetSdk 28 // штатная Android 9; для публикации в Play нужно пересмотреть
        versionCode 4
        versionName '0.4.0-engineering'
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release { minifyEnabled false }
    }
}
