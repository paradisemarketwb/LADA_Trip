name: Build Android debug APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test automotive contracts (no device required)
        run: |
          mkdir -p "$RUNNER_TEMP/vehicle-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/vehicle-tests" \
            android/app/src/main/java/ru/ladatrip/app/HumaxCanTextParser.java \
            android/app/src/main/java/ru/ladatrip/app/VehicleDisplayFormat.java \
            scripts/tests/VehicleLogicSmoke.java
          java -cp "$RUNNER_TEMP/vehicle-tests" ru.ladatrip.app.VehicleLogicSmoke
          javac -encoding UTF-8 -d "$RUNNER_TEMP/vehicle-tests" \
            android/app/src/main/java/ru/ladatrip/app/FuelCalibration.java \
            scripts/tests/FuelLogicSmoke.java
          java -cp "$RUNNER_TEMP/vehicle-tests" ru.ladatrip.app.FuelLogicSmoke
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build both debug APKs
        working-directory: android
        run: gradle --no-daemon --stacktrace --console plain :app:assembleDebug :probe:assembleDebug
      - name: Verify main APK size and ZIP integrity
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload standalone CAN Probe
        uses: actions/upload-artifact@v4
        with:
          name: can-probe-test-apk
          path: android/probe/build/outputs/apk/debug/probe-debug.apk
          if-no-files-found: error
