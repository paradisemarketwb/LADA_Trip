plugins { id 'com.android.application' }

android {
    namespace 'ru.ladatrip.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.ladatrip.app'
        minSdk 28
        targetSdk 28 // штатная Android 9; для публикации в Play нужно пересмотреть
        versionCode 10
        versionName '1.0.0-unified'
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'com.yandex.android:maps.mobile:4.6.1-full'
}
